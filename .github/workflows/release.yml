name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk church_events.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: church_events-apk
          path: church_events.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Church Events App - v1.0.0"
          body: |
            ### 📱 Church Event Registration App (APK Download)

            Download and install the APK directly on your Android phone:
            - **File**: `church_events.apk`
            
            #### How to Install on your Phone:
            1. Download `church_events.apk` directly from the **Assets** section below onto your Android phone.
            2. Tap on the downloaded APK file.
            3. If prompted by Android, enable **Allow from this source** (or *Install unknown apps*).
            4. Tap **Install** and launch the app!
          files: |
            church_events.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
